<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>US Geography Quiz</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/script.js" async defer></script>
        <script src="https://cdn.jsdelivr.net/npm/underscore@1.13.2/underscore-umd-min.js"></script>
    </head>
    <body class="text-center">
        <h1 class="p-5 bg-info">US Geography Quiz</h1>
        <br> 

        <!-- First Question -->
        <h3><span id="markImg1"></span>What is the capital of the United States?</h3>
        <input type="text" id="q1">
        <br><br>
        <div id="q1Feedback"></div>
        <br><br>
        
        <!-- Second Question -->
        <h3><span id="markImg2"></span>What's the lake in the US?</h3>
        
        <select id="q2">
            <option value="">Select One</option>
            <option value="s">Lake Superior</option>
            <option value="lh">Lake Huron</option>
            <option value="le">Lake Erie</option>
            <option value="sl">Great Salt Lake</option>
        </select>
        <br><br>
        <div id="q2Feedback"></div>
        <br><br>
        
        <!-- Third Question -->
        <h3><span id="markImg3"></span>Which of these are great lakes?</h3>
        <input type="checkbox" id="superior" class="q3-box"><label class="q3" for="superior">Lake Superior</label>
        <input type="checkbox" id="erie" class="q3-box"><label class="q3" for="erie">Lake Erie</label>
        <input type="checkbox" id="huron" class="q3-box"><label class="q3" for="huron">Lake Huron</label>
        <input type="checkbox" id="tahoe" class="q3-box"><label class="q3" for="tahoe">Lake Tahoe</label>
        <br><br>
        <div id="q3Feedback"></div>
        <br><br>
        
        <!-- Fourth Question -->
        <h3><span id="markImg4"></span>When did Hawaii officially become part of the US?</h3>
        <div id="q4Choices"></div>
        <br><br>
        <div id="q4Feedback"></div>
        <br><br>
        
        <!-- Fifth Question -->
        <h3><span id="markImg5"></span>Which one of these is a US State?</h3>
        <select id="q5Choices">
        </select>
        <br><br>
        <div id="q5Feedback"></div>
        <br><br>


        <h3 id="validationFdbk" class="bg-danger text-white"></h3>
        <button class="btn btn-outline-primary" id="custom-button">Submit Quiz</button>
        
        <br>
        <h2 id="totalScore" class="text-info"></h2>
        <h3 id="totalAttempts"></h3>
    </body>
</html>
