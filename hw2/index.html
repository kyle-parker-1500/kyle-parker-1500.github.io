<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Home</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/script.js" async defer></script>
        <script src="js/Card.js" async defer></script>
    </head>
    <body>
        <header>
            <h1>Bet.</h1>
        </header>
        <!-- Create Card -->
        <fieldset id="create-card">
            <legend>Create Card</legend>
            Card Title:<br>
            <input id="card-title" type="text"><input id="generate-title" type="button"><br>
            Card Image Source:<br>
            <input id="card-img" type="text"><input id="generate-title" type="button"><br>
            Card Description:<br>
            <input id="card-description" type="text"><input id="generate-title" type="button"><br><br>               
            <button id="create-card-button">Create Card</button><br><br>
            <button id="update-leaderboard-button">Update Card</button>
        </fieldset>
        <!-- Display Cards -->
        <div id="card-display">
            
        </div>
    </body>
</html>
