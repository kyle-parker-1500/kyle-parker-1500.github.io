<!DOCTYPE html5>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/script.js" defer></script>
    </head>
    <body>
        <h1> Sign Up Form </h1>
        <fieldset>
            <legend>Sign Up</legend>
            First Name: <input type="text"><br>
            Last Name: <input type="text"><br>
            Email: <input type="text"><br>
            Phone Number: <input type="text"><br><br>
            Zip Code: <input id="zip" type="text"><br>
            City: <span id="displayCity"></span>
            <br>
            Latitude: <span id="displayLatitude"></span>
            <br>
            Longitude: <span id="displayLongitude"></span>
            <br><br>
            State: <select id="state"></select><br>
            Select a County: <select id = "county"></select><br>

            Desired Username: <input id="username" type="text"><br>
            Password: <input id="password" type="password"><br>
            <input id="showPass" type="checkbox">Show Password<br>

            <input id="submit" type="submit" value="Sign Up!">
            <span id="is_hidden" hidden></span>
        </fieldset>
    </body>
</html>
